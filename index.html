function tr(k){return TX[LANG][k];}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('kickers_lang',l);}catch(e){}
  try{document.documentElement.lang=l;document.title=tr('title');cv.setAttribute('aria-label',tr('aria'));}catch(e){}
  if(W>1&&cv.width>1) buildBg();
}

var NAMES_EN=[['Oat','Big','Keng',''],['Uan','Champ','Phum','Tee']];
function heroName(){return tr(CHAR);}
function pname(p){if(p.nm) return p.nm[LANG==='th'?0:1];return p.isStar?heroName():(LANG==='th'?NAMES:NAMES_EN)[p.team][ROLES.indexOf(p.role)];}
var OPT={sw:true},starP=null;
try{if(window.localStorage&&localStorage.getItem('kickers_sw')==='0') OPT.sw=false;}catch(e){}
function swBtn(){return barBtns()[3];}
function setCtl(p,quiet){
  if(!p||p===hero) return;
  hero.isHero=false;hero.charging=false;hero.charge=0;hero.sprint=false;
  hero=p;p.isHero=true;
  if(!quiet){ring(p.x,p.y-20,34,'#ffd23f');sfx.pass();}
}
function switchCtl(){
  var best=null,bd=1e9;
  for(var i=1;i<4;i++){var m=players[i];if(m===hero||m.stun>0) continue;var d=dist(m,ball);if(d<bd){bd=d;best=m;}}
  setCtl(best);
}
function addSp(v){
  if(G.state!=='play'||G.sp>=1) return;
  G.sp=Math.min(1,G.sp+v);
  if(G.sp>=1){sfx.special();setBanner(tr('spReady')[0]+heroName()+tr('spReady')[1],2.2);}
}
function passLabel(){
  if(ball.owner===hero) return 'pass';
  if(OPT.sw&&(!ball.owner||ball.owner.team===1)) return 'sw';
  return 'call';
}
function pressDodge(){
  if(G.state!=='play'||G.freeze>0||ball.owner!==hero||hero.dodgeCd>0||hero.stam<0.12||hero.stun>0) return;
  hero.dodge=0.42;hero.dodgeCd=1.5;hero.dodgeHit=false;hero.stam=Math.max(0,hero.stam-0.18);
  hero.charging=false;hero.charge=0;
  ring(hero.x,hero.y-20,30,'rgb(200,140,255)');sfx.pass();
}

var AC=null,noiseBuf=null;
function initAudio(){
  try{
    if(!AC){var A=window.AudioContext||window.webkitAudioContext; if(A) AC=new A();}
    if(AC&&AC.state==='suspended') AC.resume();
  }catch(e){AC=null;}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC) return;
  try{
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,freq,delay,q){
  if(!AC) return;
  try{
    if(!noiseBuf){
      noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    var t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(vol,t+Math.min(0.15,dur*0.3));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+0.05);
  }catch(e){}
}

  else if(hyp(x-b.run.x,y-b.run.y)<b.run.r*1.15){bRun.id=id;bRun.down=true;}

  joy.x=dx/R;joy.y=dy/R;

  if(bPass.id===id){bPass.id=null;bPass.down=false;}
  if(bRun.id===id){bRun.id=null;bRun.down=false;}
}

  ball.passUser=false;ball.sup=false;
  ball.owner=p;ball.shot=null;ball.passTo=null;ball.fire=false;ball.vz=0;ball.z=0;ball.curve=null;
  p.hold=0;ball.lastTeam=p.team;ball.kicker=p;
}
function kickBall(p,tx,ty,speed,lift,isShot,fire){
  var dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy)||1;dx/=d;dy/=d;
  ball.owner=null;ball.x=p.x+dx*17;ball.y=p.y+dy*17;ball.z=1;ball.curve=null;ball.sup=false;ball.passUser=false;
  ball.vx=dx*speed;ball.vy=dy*speed;ball.vz=lift;
  ball.shot=isShot?{team:p.team,tried:{}}:null;ball.fire=!!fire;ball.lastTeam=p.team;ball.kicker=p;
  p.noTake=0.4;p.kickAnim=0.25;p.fx=dx;p.fy=dy;p.hold=0;
  dust(p.x,p.y,isShot?7:3);
  if(isShot){ring(ball.x,ball.y-5,fire?34:22,fire?'#ffd23f':'#fdfbf3');if(fire||speed>700) sparks(ball.x,ball.y-6,fire?9:4);}
}
function heroShoot(aim){
  var c=clamp(hero.charge,0,1),special=hero.isStar&&G.sp>=1;
  var gx=FW,dx=gx-hero.x,dy=MIDY-hero.y,d=hyp(dx,dy)||1;
  var cos=(dx*hero.fx+dy*hero.fy)/d,tx,ty;
  if(aim&&hyp(aim.x-hero.x,aim.y-hero.y)>12){tx=aim.x;ty=aim.y;}
  else if(hero.x>FW*0.3&&cos>0.55){
    var side=clamp((hero.fy-dy/d)*2.4,-1,1);
    tx=gx;ty=MIDY+side*GH*0.82;
  }else{tx=hero.x+hero.fx*100;ty=hero.y+hero.fy*100;}
  if(special){
    G.sp=0;G.shake=7;G.hit=0.09;say(hero,tr('sp_'+CHAR),1.2);sfx.fire();
    ring(hero.x,hero.y-20,56,'#ffd23f');sparks(hero.x,hero.y-20,10);
    if(CHAR==='wen'){
      if(tx>=gx&&Math.abs(ty-MIDY)<GH*0.35){var gkw=players[4];ty=MIDY+(gkw.y>MIDY?-1:1)*GH*0.7;}
      kickBall(hero,tx,ty,960,60,true,true);
    }else{
      var gk=players[4],sd=gk.y>MIDY?-1:1,cy=MIDY+sd*GH*0.62,D=hyp(gx-hero.x,cy-hero.y)||1,v=820,S=Math.min(125,D*0.4);
      kickBall(hero,gx,cy+sd*S,v,90,true,false);
      ball.curve={w:-sd*2*S*v/(D*D),t:D/v*0.94};
    }
    ball.sup=true;
  }else{
    kickBall(hero,tx,ty,440+c*380,40+c*150,true,false);
  }
  sfx.kick(c);
}
function pickMate(p,useFacing){
  var best=null,bs=-1e9;
  for(var i=0;i<players.length;i++){
    var m=players[i];
    if(m.team!==p.team||m===p) continue;
    var dx=m.x-p.x,dy=m.y-p.y,d=hyp(dx,dy)||1;
    var s=-d/700;
    if(useFacing) s+=(dx*p.fx+dy*p.fy)/d*1.2;
    else{

      var no=nearestOpp(m);

  }
  if(E.wind&&!ball.inNet){var wv=windVec(),wa=ball.z>0?300:75;ball.vx+=wv.x*wa*dt;ball.vy+=wv.y*wa*dt;}
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;

    var f=Math.exp(-(inPuddle(ball.x,ball.y)?5.5:E.fr)*dt);ball.vx*=f;ball.vy*=f;
    if(G.env==='rain'&&Math.random()<0.25&&hyp(ball.vx,ball.vy)>90) parts.push({x:ball.x,y:ball.y,vx:rnd(-30,30),vy:rnd(-70,-20),g:260,life:0.3,max:0.3,c:'rgba(200,230,255,',s:rnd(2,4),k:0});
  }else{var f2=Math.exp(-0.25*dt);ball.vx*=f2;ball.vy*=f2;}
  var sp=hyp(ball.vx,ball.vy);
  ball.spin+=sp*dt*0.06;
  if(ball.shot&&sp<200) {ball.shot=null;ball.fire=false;}
  if(ball.passTo){ball.passT-=dt;if(ball.passT<=0) ball.passTo=null;}
  if(ball.inNet){
    ball.vx*=Math.exp(-6*dt);ball.vy*=Math.exp(-6*dt);

  }

function tryPickup(){

    var p=players[i];

    if(ball.z>(gk?46:22)) continue;
    var d=dist(p,ball);
    if(d>(gk?23:15)*p.size) continue;

      if(ball.shot.team===p.team){ if(sp>300) continue; }
      else if(gk){
        if(ball.shot.tried[p.idx]) continue;

        if(Math.random()<ch){

          if(sp<600){take(p);}

function moveTo(p,tx,ty,spd,dt){
  var dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy),vx=0,vy=0;
  if(d>3){var s=spd*(d<22?d/22:1);vx=dx/d*s;vy=dy/d*s;
    if(d>8){p.fx=dx/d;p.fy=dy/d;}}
  var k=Math.min(1,dt*9*E.grip);
  p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
}
function ownerAI(p,dt){
  var dir=p.team?-1:1,gx=p.team?0:FW;
  var dG=hyp(gx-p.x,MIDY-p.y),no=nearestOpp(p);
  if(p.role==='gk'){
    moveTo(p,p.x,p.y,0,dt);
    if(p.hold>0.8){
      var m=(p.team===0&&hero.callT>0)?hero:pickMate(p,false);
      if(m) passTo(p,m);
    }
    return;
  }
  var ty=MIDY+(p.y<MIDY?-35:35);
  if(no.p&&no.d<85&&(no.p.x-p.x)*dir>-10) ty+=(p.y>no.p.y?1:-1)*130;
  moveTo(p,gx,clamp(ty,30,FH-30),p.speed*0.9,dt);
  var gk=players[(1-p.team)*4];
  if((dG<250&&p.hold>0.35)||(dG<340&&Math.random()<dt*0.5)){
    var side=gk.y>MIDY?-1:1;
    var ay=MIDY+side*rnd(0.25,0.85)*GH+rnd(-28,28);
    kickBall(p,gx,ay,rnd(520,660),rnd(40,120),true,false);
    sfx.kick(0.5);
    return;
  }
  if(p.team===0){
    var open=nearestOpp(hero).d>55;
    if(hero.callT>0&&p.hold>0.2){passTo(p,hero);say(p,tr('here'),0.8);return;}
    if(p.hold>0.7&&hero.x-p.x>40&&open&&Math.random()<dt*2){passTo(p,hero);return;}
    if(no.d<42&&p.hold>0.4&&Math.random()<dt*3){var m0=pickMate(p,false);if(m0&&m0.role!=='gk'){passTo(p,m0);}}
  }else{
    if(no.d<46&&p.hold>0.5&&Math.random()<dt*2.5){
      var m1=pickMate(p,false);
      if(m1&&m1.role!=='gk'&&(m1.x-p.x)*dir>-60) passTo(p,m1);

}
function gkAI(p,dt){

  }
  ty=clamp(ty,MIDY-GH+8,MIDY+GH-8);

}

         (P.style==='pass'&&p.hold>0.8&&o.open>55&&Math.random()<0.45)){passTo(p,o.m);return;}

  for(i=0;i<offs.length;i++){

    for(var j=0;j<4;j++){var o2=players[j],d=hyp(qx-o2.x,qy-o2.y);if(d<85&&o2.stun<=0) c+=(85-d)/85*(o2.role==='gk'?0.4:1.5);}

function oppFieldAI(p,dt){

    else if(p.role==='mid'){tx=clamp(own.x+(own.role==='fwd'?80:-110),90,FW-80);ty=own.y+(own.y<MIDY?140:-140);}

    var mk=nearestOpp(p);

  }

    if(p.role==='def'){moveTo(p,clamp(own.x+115,FW*0.5,FW-95),MIDY+(own.y-MIDY)*0.65,sp*0.95,dt);return;}
  }

}

function bumpCheck(a,c,nx,ny){

  var rel=(big.vx-sm.vx)*sx+(big.vy-sm.vy)*sy;
  if(rel<105) return;

  if(ball.owner===sm&&Math.random()<0.6){

function trySteal(dt){
  var o=ball.owner;
  if(!o||o.role==='gk') return;
  if(o.dodge>0){
    var fell=false;
    for(var q=0;q<players.length;q++){
      var a=players[q];
      if(a.team===o.team||a.stun>0||a.role==='gk') continue;
      if(dist(a,ball)>19*a.size&&dist(a,o)>18) continue;
      var ax=a.x-o.x,ay=a.y-o.y,ad=hyp(ax,ay)||1;
      a.stun=0.95;a.vx=ax/ad*150;a.vy=ay/ad*150;a.wind=0;a.spT=0;
      sparks(a.x,a.y-24,5);dust(a.x,a.y,5);fell=true;
    }
    if(fell&&!o.dodgeHit){o.dodgeHit=true;say(o,tr('dodged'),0.9);addSp(0.15);G.m.dodge++;sfx.steal();G.shake=Math.max(G.shake,3);}
    return;
  }
  if(o.hold<0.3) return;
  if(o.spT>0&&(o.sp==='spin'||o.sp==='bull')) return;
  for(var i=0;i<players.length;i++){
    var p=players[i];
    if(p.team===o.team||p.stun>0||p.noTake>0) continue;
    if(dist(p,ball)>16*p.size&&dist(p,o)>15) continue;
    var ok=false,sure=p.isHero&&p.lunge>0;
    if(p.isHero) ok=sure||Math.random()<2.0*dt;
    else if(p.team===1) ok=Math.random()<G.opp.steal*(o.isHero&&o.charging?1.5:1)*dt;
    else ok=Math.random()<G.opp.mateSteal*dt;
    if(o.team===1){
      if(o.wind>0) ok=ok||Math.random()<7*dt;
      if(o.tired>0) ok=ok||Math.random()<5*dt;
      if(ok&&!sure&&o.spT>0&&o.sp==='dash'&&Math.random()<0.4) ok=false;
      if(ok&&o.cap&&o.sp==='spin'&&o.spCd<=0&&o.tired<=0){
        o.spT=0.7;o.spCd=G.opp.spCd*0.75;p.stun=0.55;p.lunge=0;special(o);
        return;
      }
    }
    if(ok){
      o.noTake=0.75;o.stun=sure?0.45:0.2;o.wind=0;
      if(o.isHero){o.charging=false;o.charge=0;}
      take(p);sfx.steal();dust(ball.x,ball.y,4);sparks(ball.x,ball.y-6,3);
      if(p.isHero){say(p,tr('got'),0.8);addSp(0.2);G.m.tackle++;}
      return;
    }
  }
}
function heroUpdate(p,dt){
  var mx=joy.x,my=joy.y;

    mx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
    my=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  }
  var m=hyp(mx,my);
  if(m>1){mx/=m;my/=m;m=1;}
  if(m>0.15){p.fx=mx/m;p.fy=my/m;} else {mx=my=0;m=0;}
  if(p.exh&&p.stam>0.3) p.exh=false;
  var run=(bRun.down||keys['shift'])&&m>0.15&&!p.exh&&p.stam>0&&!p.charging;
  if(run){p.stam-=dt*(ball.owner===p?0.5:0.42)*E.stam;if(p.stam<=0){p.stam=0;p.exh=true;say(p,tr('tired'),0.9);}}
  else p.stam=Math.min(1,p.stam+dt*(m>0.15?0.13:0.24)/(E.stam>1?1.35:1));
  p.sprint=run;
  var sp=p.speed*(p.isStar?1:1.1)*(ball.owner===p?0.93:1)*(p.charging?0.75:1)*(run?1.36:1)*(p.exh?0.82:1)*(p.dodge>0?1.3:1);
  var vx=mx*sp,vy=my*sp;
  if(p.dodge>0&&m===0){vx=p.fx*sp;vy=p.fy*sp;}
  if(p.lunge>0){vx=p.lx*p.speed*2.1;vy=p.ly*p.speed*2.1;}
  var k=Math.min(1,dt*12*E.grip);
  p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
  if(p.charging){
    if(ball.owner!==p){p.charging=false;p.charge=0;}
    else p.charge=Math.min(1,p.charge+dt/0.85);
  }
}

}

function update(dt){
  G.t+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt);
  var slow=(G.state==='goal'&&G.goalE<0.5)?0.3:1;
  G.netHit[0].t+=dt*slow;G.netHit[1].t+=dt*slow;
  if(G.hit>0){G.hit-=dt;return;}
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0) G.banner=null;}
  for(var b=0;b<players.length;b++){var q=players[b];if(q.bub){q.bub.t-=dt;if(q.bub.t<=0) q.bub=null;}}
  updParts(dt);
  if(G.state==='title'||G.state==='stages'||G.state==='shop'||G.state==='trophy') return;
  if(G.state==='intro'){G.introT+=dt;return;}
  if(G.state==='end'){G.endT+=dt;return;}
  if(G.state==='goal'){
    G.goalT-=dt;G.goalE+=dt;ballPhysics(dt*slow);
    if(G.goalT<=0){ if(G.over) endMatch(); else {G.state='play';kickoff(G.concede);} }
    return;
  }
  if(G.freeze>0){G.freeze-=dt;return;}
  if(!G.golden){
    G.time-=dt;
    if(G.time<=0){G.time=0;
      if(G.score[0]!==G.score[1]){endMatch();return;}
      G.golden=true;sfx.whistle();setBanner(tr('draw'),2.4);
    }
  }
  var i,p,own=ball.owner;
  var ch=[null,null],cd=[1e9,1e9];
  for(i=0;i<players.length;i++){p=players[i];
    if(p.role==='gk'||p.isHero||p.stun>0) continue;
    var d=dist(p,ball);if(d<cd[p.team]){cd[p.team]=d;ch[p.team]=p;}
  }
  oppExtras(dt);
  for(i=0;i<players.length;i++){
    p=players[i];
    if(p.bumpCd>0) p.bumpCd-=dt;
    if(p.dodge>0) p.dodge-=dt;
    if(p.dodgeCd>0) p.dodgeCd-=dt;
    if(!p.isHero&&p.team===0&&p.stam<1){p.stam=Math.min(1,p.stam+dt*0.2);p.exh=false;p.sprint=false;}
    if(p.stun>0){p.stun-=dt;p.vx*=0.8;p.vy*=0.8;}
    if(p.noTake>0) p.noTake-=dt;
    if(p.kickAnim>0) p.kickAnim-=dt;
    if(p.callT>0) p.callT-=dt;
    if(p.lunge>0) p.lunge-=dt;
    if(p.lungeCd>0) p.lungeCd-=dt;
    if(own===p) p.hold+=dt;
    if(p.stun<=0){
      if(p.isHero) heroUpdate(p,dt);
      else if(own===p){if(p.team===1&&p.role!=='gk') oppOwnerAI(p,dt); else ownerAI(p,dt);}
      else if(p.role==='gk') gkAI(p,dt);
      else if(p.team===1) oppFieldAI(p,dt);
      else fieldAI(p,dt,ch[p.team],own&&own.team===p.team,own&&own.team!==p.team);
    }
    own=ball.owner;
  }
  for(i=0;i<players.length;i++){
    for(var j=i+1;j<players.length;j++){
      var a=players[i],c=players[j],dx=c.x-a.x,dy=c.y-a.y,dd=hyp(dx,dy);
      var RR=8.5*(a.size+c.size);
      if(dd<RR&&dd>0.01){var push=(RR-dd)/2;dx/=dd;dy/=dd;a.x-=dx*push;a.y-=dy*push;c.x+=dx*push;c.y+=dy*push;bumpCheck(a,c,dx,dy);}
    }
  }
  for(i=0;i<players.length;i++){
    p=players[i];
    var pud=inPuddle(p.x,p.y)?0.72:1;
    p.x=clamp(p.x+p.vx*dt*pud,4,FW-4);p.y=clamp(p.y+p.vy*dt*pud,8,FH-6);
    if(pud<1&&Math.random()<0.2&&hyp(p.vx,p.vy)>60) parts.push({x:p.x,y:p.y,vx:rnd(-40,40),vy:rnd(-80,-30),g:260,life:0.3,max:0.3,c:'rgba(200,230,255,',s:rnd(2,4),k:0});
    var spd=hyp(p.vx,p.vy);p.run+=spd*dt*0.1;
    var st=Math.floor(p.run/PI);
    if(st!==p.stepI){p.stepI=st;if(spd>125||p.lunge>0) dust(p.x-p.fx*6,p.y,1);}
    if(p.lunge>0&&Math.random()<0.6) dust(p.x-p.lx*8,p.y,1);
  }
  if(ball.owner){
    var o=ball.owner,tx=o.x+o.fx*15*o.size,ty=o.y+o.fy*12*o.size,kk=Math.min(1,dt*18);
    ball.x+=(tx-ball.x)*kk;ball.y+=(ty-ball.y)*kk;ball.z=0;
    ball.vx=o.vx;ball.vy=o.vy;ball.spin+=hyp(o.vx,o.vy)*dt*0.06;
    trySteal(dt);
  }else{
    ballPhysics(dt);
    if(G.state==='play') tryPickup();
    if(ball.fire&&Math.random()<0.8) parts.push({x:ball.x,y:ball.y-ball.z*0.8,vx:rnd(-30,30),vy:rnd(-30,30),g:0,life:0.35,max:0.35,c:'rgba(255,150,40,',s:rnd(5,9),k:0});
  }
  var bsp=hyp(ball.vx,ball.vy);
  if(!ball.owner&&bsp>330){trail.push({x:ball.x,y:ball.y-5-ball.z*0.8});if(trail.length>7) trail.shift();}
  else if(trail.length) trail.shift();
  if(G.state==='play'){
    updDog(dt);updEnv(dt);
    if(ball.owner===hero&&hero.x>FW*0.68&&Math.random()<dt*0.5){
      var mate=players[2];if(!mate.bub) say(mate,tr('shootIt'),0.9);
    }
  }

    if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;}
    var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();

    else{f.type='lowpass';f.frequency.value=320;g.gain.value=0.11;}

var last=0,acc=0,STEP=1/60;
var errN=0;
function frame(ts){
  requestAnimationFrame(frame);
  try{
    var v=viewSize();
    if(v[0]!==W||v[1]!==H) resize();
    var dt=Math.min(0.1,(ts-last)/1000||0);last=ts;
    if(W<2||H<2||!bg||!bg.width||!bg.height) return;
    acc+=dt;
    var n=0;
    while(acc>=STEP&&n<4){if(!G.paused) update(STEP);acc-=STEP;n++;}
    if(n===4) acc=0;
    draw();
  }catch(e){
    if(errN++<3&&window.__showErr) window.__showErr(String(e&&e.message||e)+(e&&e.line?' (line '+e.line+')':''));
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
document.addEventListener('visibilitychange',function(){last=performance.now();acc=0;});

  get players(){return players;},
  get ball(){return ball;},get hero(){return hero;}};
requestAnimationFrame(frame);
})();
