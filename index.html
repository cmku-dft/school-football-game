var AC=null,noiseBuf=null;
function initAudio(){
  try{
    if(!AC){var A=window.AudioContext||window.webkitAudioContext; if(A) AC=new A();}
    if(AC&&AC.state==='suspended') AC.resume();
  }catch(e){AC=null;}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC) return;
  try{
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,freq,delay,q){
  if(!AC) return;
  try{
    if(!noiseBuf){
      noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    var t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(vol,t+Math.min(0.15,dur*0.3));
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+0.05);
  }catch(e){}
}

function mkPlayer(team,ri,idx){
  var role=ROLES[ri],L=LEVELS[G.level],h=HOME[role];
  var p={team:team,role:role,idx:idx,name:NAMES[team][ri],
    hx:team?FW-h[0]:h[0],hy:team?FH-h[1]:h[1],x:0,y:0,vx:0,vy:0,fx:team?-1:1,fy:0,
    speed:team?L.spd:138,size:team?L.size:1,isHero:false,
    skin:SKINS[(idx*3+team)%SKINS.length],hair:'#2b1d14',
    shirt:team?L.shirt:'#ff6a3d',shorts:team?'#22252b':'#27407a',shoe:team?'#f4f4f4':'#1c1c1c',
    stun:0,noTake:0,hold:0,kickAnim:0,run:rnd(0,6),bub:null,callT:0,
    lunge:0,lungeCd:0,lx:0,ly:0,charging:false,charge:0,
    hs:(idx*3+team*2)%5===2?3:(idx*3+team*2)%5,num:[1,4,8,10][ri],sock:team?'#e9e9e9':'#fdfbf3',stepI:0};
  p.hair=['#2b1d14','#1b1411','#3a2416','#241812'][idx%4];
  if(role==='gk'){p.shirt=team?'#f2e14b':'#ffd23f';p.speed=team?L.spd*0.95:128;}
  if(team===0&&role==='fwd'){p.isHero=true;p.speed=168;p.skin='#f2c69a';charLook(p,CHAR);}
  return p;
}
function setupMatch(){
  players=[];
  for(var t=0;t<2;t++) for(var r=0;r<4;r++) players.push(mkPlayer(t,r,players.length));
  hero=players[3];
  ball={x:FW/2,y:MIDY,z:0,vx:0,vy:0,vz:0,owner:null,shot:null,passTo:null,passT:0,fire:false,inNet:false,spin:0,lastTeam:0};
  G.score=[0,0];G.time=90;G.golden=false;G.over=false;G.banner=null;
  dog.on=false;dog.next=rnd(16,24);parts=[];trail=[];G.scorer=null;
  kickoff(0,true);
}
function kickoff(team,silent){
  for(var i=0;i<players.length;i++){
    var p=players[i];
    p.x=p.hx;p.y=p.hy;p.vx=p.vy=0;p.fx=p.team?-1:1;p.fy=0;
    p.stun=0;p.noTake=0;p.hold=0;p.lunge=0;p.charging=false;p.charge=0;p.callT=0;
    if(p.team!==team&&p.role!=='gk'){
      if(p.team===0) p.x=Math.min(p.x,FW/2-95); else p.x=Math.max(p.x,FW/2+95);
    }
  }
  var k=players[team*4+3];
  k.x=FW/2-(team?-14:14);k.y=MIDY;
  ball.x=FW/2;ball.y=MIDY;ball.z=0;ball.vx=ball.vy=ball.vz=0;
  ball.owner=k;ball.shot=null;ball.passTo=null;ball.fire=false;ball.inNet=false;
  G.freeze=1.3;
  if(!silent) sfx.whistle();
}
function startMatch(){
  G.paused=false;setupMatch();G.state='play';sfx.whistle();
  setBanner(tr('vs')+cls(G.level)+tr('go'),1.6);
}
function setBanner(t,d){G.banner={text:t,t:d,d:d};}
function say(p,t,d){p.bub={text:t,t:d||1.1};}

function btnPos(){
  return {shoot:{x:W-100*U,y:H-105*U,r:58*U},pass:{x:W-225*U,y:H-68*U,r:46*U}};
}
function inBtn(b,x,y){return hyp(x-b.x,y-b.y)<b.r*1.25;}
function pressShoot(){
  if(G.state!=='play'||G.freeze>0) return;
  if(ball.owner===hero){hero.charging=true;hero.charge=0;}
  else if(hero.lungeCd<=0&&hero.stun<=0){
    hero.lunge=0.26;hero.lungeCd=0.75;hero.lx=hero.fx;hero.ly=hero.fy;
    dust(hero.x,hero.y,5);sfx.pass();
  }
}
function releaseShoot(aim){
  if(hero&&hero.charging){
    if(ball.owner===hero&&G.state==='play') heroShoot(aim);
    hero.charging=false;hero.charge=0;
  }
}
function pressPass(aim){
  if(G.state!=='play'||G.freeze>0) return;
  if(ball.owner===hero){
    if(aim){var ad=hyp(aim.x-hero.x,aim.y-hero.y);if(ad>12){hero.fx=(aim.x-hero.x)/ad;hero.fy=(aim.y-hero.y)/ad;}}
    var t=pickMate(hero,true);
    if(t) passTo(hero,t);
  }else{
    hero.callT=1.6;say(hero,tr('callPass'),0.9);
  }
}
function menuTap(x,y){
  initAudio();
  if(typeof x==='number'&&(G.state==='title'||G.state==='end')){

  }
  if(G.state==='title'){
    if(typeof x!=='number'){startMatch();return;}

  else if(G.state==='end'&&G.endT>0.9){

    if(typeof x==='number'&&hit(menuBtn(),x,y)){setupMatch();G.state='title';G.freeze=0;return;}
    startMatch();
  }
}

/* ---------- ลูกบอล ---------- */
function take(p){
  ball.owner=p;ball.shot=null;ball.passTo=null;ball.fire=false;ball.vz=0;ball.z=0;
  p.hold=0;ball.lastTeam=p.team;ball.kicker=p;
}
function kickBall(p,tx,ty,speed,lift,isShot,fire){
  var dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy)||1;dx/=d;dy/=d;
  ball.owner=null;ball.x=p.x+dx*17;ball.y=p.y+dy*17;ball.z=1;
  ball.vx=dx*speed;ball.vy=dy*speed;ball.vz=lift;
  ball.shot=isShot?{team:p.team,tried:{}}:null;ball.fire=!!fire;ball.lastTeam=p.team;ball.kicker=p;
  p.noTake=0.4;p.kickAnim=0.25;p.fx=dx;p.fy=dy;p.hold=0;
  dust(p.x,p.y,isShot?7:3);
  if(isShot){ring(ball.x,ball.y-5,fire?34:22,fire?'#ffd23f':'#fdfbf3');if(fire||speed>700) sparks(ball.x,ball.y-6,fire?9:4);}
}
function heroShoot(aim){
  var c=clamp(hero.charge,0,1),fire=c>=0.95;
  var gx=FW,dx=gx-hero.x,dy=MIDY-hero.y,d=hyp(dx,dy)||1;
  var cos=(dx*hero.fx+dy*hero.fy)/d,tx,ty;
  if(aim&&hyp(aim.x-hero.x,aim.y-hero.y)>12){tx=aim.x;ty=aim.y;}
  else if(hero.x>FW*0.3&&cos>0.55){
    var side=clamp((hero.fy-dy/d)*2.4,-1,1);
    tx=gx;ty=MIDY+side*GH*0.82;
  }else{tx=hero.x+hero.fx*100;ty=hero.y+hero.fy*100;}
  var sp=fire?900:440+c*380;
  kickBall(hero,tx,ty,sp,40+c*150,true,fire);
  if(fire){sfx.fire();G.shake=6;G.hit=0.07;say(hero,tr('fire'),1);}
  sfx.kick(c);
}
function pickMate(p,useFacing){
  var best=null,bs=-1e9;
  for(var i=0;i<players.length;i++){
    var m=players[i];
    if(m.team!==p.team||m===p) continue;
    var dx=m.x-p.x,dy=m.y-p.y,d=hyp(dx,dy)||1;
    var s=-d/700;
    if(useFacing) s+=(dx*p.fx+dy*p.fy)/d*1.2;
    else{
      s+=(p.team?-dx:dx)/300;
      var no=nearestOpp(m);
      s+=Math.min(no.d,120)/150;
    }
    if(m.role==='gk') s-=0.9;
    if(d<50) s-=1;
    if(s>bs){bs=s;best=m;}
  }
  return best;
}
function passTo(p,m){
  var d=dist(p,m);
  var tx=m.x+m.vx*0.3,ty=m.y+m.vy*0.3;
  kickBall(p,tx,ty,clamp(1.2*d+170,300,720),d>280?130:0,false,false);
  ball.passTo=m;ball.passT=2;
  sfx.pass();
}
function nearestOpp(p){
  var b=null,bd=1e9;
  for(var i=0;i<players.length;i++){var o=players[i];if(o.team===p.team) continue;
    var d=dist(o,p);if(d<bd){bd=d;b=o;}}
  return {p:b,d:bd};
}
function netCore(s,y){
  var h=G.netHit[s];if(h.t>3) return 0;
  var q=(y-h.y)/50;
  return h.a*Math.exp(-3.1*h.t)*Math.cos(12.5*h.t)*Math.exp(-q*q);
}
function netB(s,u,y){
  var h=G.netHit[s],b=0;
  if(h.t<=3){b=netCore(s,y)+h.a*0.2*Math.exp(-2.6*h.t)*Math.sin((y-h.y)*0.12-h.t*24);}
  if(ball.inNet&&(ball.x<FW/2?0:1)===s){var q=(y-ball.y)/17;b+=5*Math.exp(-q*q);}
  return u*b;
}
function ballPhysics(dt){
  if(ball.owner) return;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;
  if(ball.z>0){ball.vz-=900*dt;}
  if(ball.z<=0){ball.z=0;
    if(ball.vz<-70){ball.vz=-ball.vz*0.5;sfx.bounce();}else ball.vz=0;
    var f=Math.exp(-1.2*dt);ball.vx*=f;ball.vy*=f;
  }else{var f2=Math.exp(-0.25*dt);ball.vx*=f2;ball.vy*=f2;}
  var sp=hyp(ball.vx,ball.vy);
  ball.spin+=sp*dt*0.06;
  if(ball.shot&&sp<200) {ball.shot=null;ball.fire=false;}
  if(ball.passTo){ball.passT-=dt;if(ball.passT<=0) ball.passTo=null;}
  if(ball.inNet){
    ball.vx*=Math.exp(-6*dt);ball.vy*=Math.exp(-6*dt);
    var sN=ball.x<FW/2?0:1,lim=31+Math.max(0,netCore(sN,ball.y))*0.9;
    ball.x=clamp(ball.x,-lim,FW+lim);
    ball.y=clamp(ball.y,MIDY-GH+6,MIDY+GH-6);
    return;
  }
  if(ball.y<6){ball.y=6;ball.vy=Math.abs(ball.vy)*0.7;sfx.bounce();}
  if(ball.y>FH-6){ball.y=FH-6;ball.vy=-Math.abs(ball.vy)*0.7;sfx.bounce();}
  if(ball.x<0||ball.x>FW){
    var left=ball.x<0;
    if(Math.abs(ball.y-MIDY)<GH&&ball.z<48){ if(G.state==='play') goal(left?1:0); }
    else{ball.x=left?1:FW-1;ball.vx=(left?1:-1)*Math.abs(ball.vx)*0.65;sfx.bounce();ball.shot=null;ball.fire=false;}
  }
}
function tryPickup(){
  if(ball.owner||ball.inNet) return;
  var sp=hyp(ball.vx,ball.vy),best=null,bd=1e9;
  for(var i=0;i<players.length;i++){
    var p=players[i];
    if(p.stun>0||p.noTake>0) continue;
    var gk=p.role==='gk';
    if(ball.z>(gk?46:22)) continue;
    var d=dist(p,ball);
    if(d>(gk?23:15)*p.size) continue;
    if(ball.shot){
      if(ball.shot.team===p.team){ if(sp>300) continue; }
      else if(gk){
        if(ball.shot.tried[p.idx]) continue;
        ball.shot.tried[p.idx]=1;
        var ch=(p.team?LEVELS[G.level].gk:0.62)*(ball.fire?0.45:1)*(sp>650?0.85:1);
        if(Math.random()<ch){
          sfx.save();say(p,tr('save'),0.9);sparks(ball.x,ball.y-8,7);ring(ball.x,ball.y-8,20,'#ffd23f');
          if(sp<600){take(p);}
          else{ball.vx=-ball.vx*0.35;ball.vy+=rnd(-220,220);ball.vz=160;ball.shot=null;ball.fire=false;p.noTake=0.3;}
          return;
        }
        continue;
      }else if(sp>520){
        ball.vx=-ball.vx*0.3+rnd(-80,80);ball.vy=ball.vy*0.3+rnd(-150,150);ball.vz=140;
        ball.shot=null;ball.fire=false;p.stun=0.25;sfx.bounce();say(p,tr('ouch'),0.7);
        return;
      }
    }
    if(d<bd){bd=d;best=p;}
  }
  if(best) take(best);
}
function trySteal(dt){
  var o=ball.owner;
  if(!o||o.role==='gk') return;
  for(var i=0;i<players.length;i++){
    var p=players[i];
    if(p.team===o.team||p.stun>0||p.noTake>0) continue;
    if(dist(p,ball)>16*p.size&&dist(p,o)>15) continue;
    var ok=false;
    if(p.isHero) ok=p.lunge>0||Math.random()<3.2*dt;
    else ok=Math.random()<(p.team?LEVELS[G.level].steal:2.4)*dt;
    if(ok){
      o.noTake=0.75;o.stun=p.isHero&&p.lunge>0?0.45:0.2;
      if(o.isHero){o.charging=false;o.charge=0;}
      take(p);sfx.steal();dust(ball.x,ball.y,4);sparks(ball.x,ball.y-6,3);
      if(p.isHero) say(p,tr('got'),0.8);
      return;
    }
  }
}
function goal(team){
  var side=team?0:1,sp=hyp(ball.vx,ball.vy),gx=side?FW:0,d=side?-1:1;
  G.score[team]++;G.state='goal';G.goalT=3.6;G.goalE=0;G.lastScorer=team;G.concede=1-team;G.side=side;
  G.over=G.golden||G.time<=0;
  G.scorer=(ball.kicker&&ball.kicker.team===team)?ball.kicker:null;
  G.netHit[side]={t:0,y:ball.y,a:clamp(sp/26,11,27)};
  ball.inNet=true;ball.vx*=0.55;ball.vy*=0.4;ball.shot=null;ball.fire=false;
  G.shake=team===0?14:8;G.flash=team===0?0.32:0.12;
  sfx.net();
  ring(ball.x,ball.y-5,46,'#fdfbf3');ring(ball.x,ball.y-5,26,'#ffd23f');sparks(ball.x,ball.y-6,12);
  if(team===0){sfx.cheer();confetti();burst(gx,MIDY-GH,d);burst(gx,MIDY+GH,d);}else{sfx.boo();}
  for(var i=0;i<players.length;i++){var p=players[i];p.charging=false;p.charge=0;
    if(p.team===team&&Math.random()<0.7) say(p,tr('cheers')[i%4],2);
    else if(p.team!==team&&Math.random()<0.4) say(p,tr('sads')[i%3],2);
  }
  joy.x=joy.y=0;
}
function endMatch(){
  G.state='end';G.endT=0;G.win=G.score[0]>G.score[1];
  G.champion=G.win&&G.level===LEVELS.length-1;
  sfx.whistleEnd();
  if(G.win){sfx.cheer();confetti();}
}

/* ---------- AI ---------- */
function moveTo(p,tx,ty,spd,dt){
  var dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy),vx=0,vy=0;
  if(d>3){var s=spd*(d<22?d/22:1);vx=dx/d*s;vy=dy/d*s;
    if(d>8){p.fx=dx/d;p.fy=dy/d;}}
  var k=Math.min(1,dt*9);
  p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
}
function ownerAI(p,dt){
  var dir=p.team?-1:1,gx=p.team?0:FW;
  var dG=hyp(gx-p.x,MIDY-p.y),no=nearestOpp(p);
  if(p.role==='gk'){
    moveTo(p,p.x,p.y,0,dt);
    if(p.hold>0.8){
      var m=(p.team===0&&hero.callT>0)?hero:pickMate(p,false);
      if(m) passTo(p,m);
    }
    return;
  }
  var ty=MIDY+(p.y<MIDY?-35:35);
  if(no.p&&no.d<85&&(no.p.x-p.x)*dir>-10) ty+=(p.y>no.p.y?1:-1)*130;
  moveTo(p,gx,clamp(ty,30,FH-30),p.speed*0.9,dt);
  var gk=players[(1-p.team)*4];
  if((dG<250&&p.hold>0.35)||(dG<340&&Math.random()<dt*0.5)){
    var side=gk.y>MIDY?-1:1;
    var ay=MIDY+side*rnd(0.25,0.85)*GH+rnd(-28,28);
    kickBall(p,gx,ay,rnd(520,660)+(p.team?G.level*30:0),rnd(40,120),true,false);
    sfx.kick(0.5);
    return;
  }
  if(p.team===0){
    var open=nearestOpp(hero).d>55;
    if(hero.callT>0&&p.hold>0.2){passTo(p,hero);say(p,tr('here'),0.8);return;}
    if(p.hold>0.7&&hero.x-p.x>40&&open&&Math.random()<dt*2){passTo(p,hero);return;}
    if(no.d<42&&p.hold>0.4&&Math.random()<dt*3){var m0=pickMate(p,false);if(m0&&m0.role!=='gk'){passTo(p,m0);}}
  }else{
    if(no.d<46&&p.hold>0.5&&Math.random()<dt*2.5){
      var m1=pickMate(p,false);
      if(m1&&m1.role!=='gk'&&(m1.x-p.x)*dir>-60) passTo(p,m1);
    }
  }
}
function gkAI(p,dt){
  var dir=p.team?-1:1,gx=p.team?FW:0,lx=gx+dir*22;
  var ty=ball.y;
  if(!ball.owner&&ball.vx*dir<-60){
    var t=(lx-ball.x)/ball.vx;
    if(t>0&&t<1.5) ty=ball.y+ball.vy*t;
  }
  ty=clamp(ty,MIDY-GH+8,MIDY+GH-8);
  var sp=hyp(ball.vx,ball.vy);
  if(!ball.owner&&!ball.inNet&&sp<260&&hyp(ball.x-gx,ball.y-MIDY)<125) moveTo(p,ball.x,ball.y,p.speed,dt);
  else moveTo(p,lx,ty,p.speed,dt);
  if(!ball.owner||ball.owner.team!==p.team){var dx=ball.x-p.x,dy=ball.y-p.y,d=hyp(dx,dy)||1;p.fx=dx/d;p.fy=dy/d;}
}
function fieldAI(p,dt,chaser,teamHas,oppHas){
  if(ball.passTo===p&&!ball.owner){moveTo(p,ball.x+ball.vx*0.15,ball.y+ball.vy*0.15,p.speed,dt);return;}
  var passMine=ball.passTo&&ball.passTo.team===p.team;
  if(chaser===p&&!teamHas&&!passMine){
    moveTo(p,ball.x+ball.vx*0.2,ball.y+ball.vy*0.2,p.speed,dt);return;
  }
  var dir=p.team?-1:1,k=p.role==='def'?0.35:(p.role==='mid'?0.6:0.7);
  var tx=p.hx+(ball.x-FW/2)*k+(teamHas?dir*75:0)+(oppHas?-dir*30:0)+Math.sin(G.t*0.7+p.idx)*14;
  var ty=p.hy+(ball.y-MIDY)*0.25+Math.cos(G.t*0.5+p.idx*2)*14;
  if(p.role==='def'){ if(p.team===0) tx=Math.min(tx,FW*0.6); else tx=Math.max(tx,FW*0.4); }
  moveTo(p,clamp(tx,30,FW-30),clamp(ty,30,FH-30),p.speed*0.85,dt);
}
function heroUpdate(p,dt){
  var mx=joy.x,my=joy.y;
  if(joy.id===null){
    mx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
    my=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  }
  var m=hyp(mx,my);
  if(m>1){mx/=m;my/=m;m=1;}
  if(m>0.15){p.fx=mx/m;p.fy=my/m;} else {mx=my=0;}
  var sp=p.speed*(ball.owner===p?0.93:1)*(p.charging?0.75:1);
  var vx=mx*sp,vy=my*sp;
  if(p.lunge>0){vx=p.lx*p.speed*2.1;vy=p.ly*p.speed*2.1;}
  var k=Math.min(1,dt*12);
  p.vx+=(vx-p.vx)*k;p.vy+=(vy-p.vy)*k;
  if(p.charging){
    if(ball.owner!==p){p.charging=false;p.charge=0;}
    else p.charge=Math.min(1,p.charge+dt/0.85);
  }
}
function updDog(dt){
  if(!dog.on){
    dog.next-=dt;
    if(dog.next<=0){
      dog.on=true;dog.hit=false;dog.t=7;dog.bub=0;
      dog.x=Math.random()<0.5?-70:FW+70;dog.y=rnd(60,FH-60);
      sfx.bark();setBanner(tr('dog'),1.6);
    }
    return;
  }
  dog.t-=dt;if(dog.bub>0) dog.bub-=dt;
  if(!dog.hit&&dog.t>0){
    var dx=ball.x-dog.x,dy=ball.y-dog.y,d=hyp(dx,dy)||1;
    dog.vx=dx/d*205;dog.vy=dy/d*205;
    if(d<18&&ball.z<20&&!ball.inNet&&!(ball.owner&&ball.owner.role==='gk')){
      dog.hit=true;dog.bub=1.2;
      if(ball.owner){ball.owner.noTake=0.6;if(ball.owner.isHero){hero.charging=false;hero.charge=0;}}
      ball.owner=null;ball.shot=null;ball.passTo=null;ball.fire=false;
      var a=rnd(0,TAU);ball.vx=Math.cos(a)*380;ball.vy=Math.sin(a)*380;ball.vz=230;ball.z=1;
      sfx.bark();dust(ball.x,ball.y,6);
    }
  }else{
    dog.vx=(dog.x<FW/2?-1:1)*240;dog.vy=0;
  }
  dog.x+=dog.vx*dt;dog.y+=dog.vy*dt;
  if(dog.x<-110||dog.x>FW+110){dog.on=false;dog.next=rnd(22,36);}
}

/* ---------- เอฟเฟกต์ ---------- */
function dust(x,y,n){
  for(var i=0;i<n;i++) parts.push({x:x,y:y,vx:rnd(-50,50),vy:rnd(-40,10),g:0,life:rnd(0.25,0.5),max:0.5,c:'rgba(214,190,150,',s:rnd(3,6),k:0});
}
function sparks(x,y,n){
  for(var i=0;i<n;i++){var a=rnd(0,TAU),v=rnd(60,170);parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,g:160,life:rnd(0.3,0.55),max:0.55,c:i%2?'#ffd23f':'#fdfbf3',s:rnd(4,7),k:2});}
}
function ring(x,y,r,c){parts.push({x:x,y:y,vx:0,vy:0,g:0,life:0.28,max:0.28,c:c,s:r,k:3});}
function burst(x,y,d){
  var cols=['#ffd23f','#ff6a3d','#3aa0e8','#35b86b','#ffffff','#ff5fa2'];
  for(var i=0;i<34;i++) parts.push({x:x,y:y,vx:d*rnd(60,360),vy:rnd(-420,-120),g:520,life:rnd(1.2,2.2),max:2.2,c:cols[i%cols.length],s:rnd(5,9),k:1,r:rnd(0,6)});
}
function confetti(){
  var cols=['#ffd23f','#ff6a3d','#3aa0e8','#35b86b','#ffffff','#ff5fa2'];
  for(var i=0;i<90;i++) parts.push({x:rnd(0,FW),y:rnd(-140,-20),vx:rnd(-40,40),vy:rnd(80,260),g:60,
    life:rnd(1.8,3.2),max:3.2,c:cols[i%cols.length],s:rnd(5,9),k:1,r:rnd(0,6)});
}
function updParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k===1) p.r+=dt*6;
  }
  if(parts.length>260) parts.splice(0,parts.length-260);
}

/* ---------- อัปเดตหลัก ---------- */
function update(dt){
  G.t+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*30);
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt);
  var slow=(G.state==='goal'&&G.goalE<0.5)?0.3:1;
  G.netHit[0].t+=dt*slow;G.netHit[1].t+=dt*slow;
  if(G.hit>0){G.hit-=dt;return;}
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0) G.banner=null;}
  for(var b=0;b<players.length;b++){var q=players[b];if(q.bub){q.bub.t-=dt;if(q.bub.t<=0) q.bub=null;}}
  updParts(dt);
  if(G.state==='title') return;
  if(G.state==='end'){G.endT+=dt;return;}
  if(G.state==='goal'){
    G.goalT-=dt;G.goalE+=dt;ballPhysics(dt*slow);
    if(G.goalT<=0){ if(G.over) endMatch(); else {G.state='play';kickoff(G.concede);} }
    return;
  }
  if(G.freeze>0){G.freeze-=dt;return;}
  if(!G.golden){
    G.time-=dt;
    if(G.time<=0){G.time=0;
      if(G.score[0]!==G.score[1]){endMatch();return;}
      G.golden=true;sfx.whistle();setBanner(tr('draw'),2.4);
    }
  }
  var i,p,own=ball.owner;
  var ch=[null,null],cd=[1e9,1e9];
  for(i=0;i<players.length;i++){p=players[i];
    if(p.role==='gk'||p.isHero||p.stun>0) continue;
    var d=dist(p,ball);if(d<cd[p.team]){cd[p.team]=d;ch[p.team]=p;}
  }
  for(i=0;i<players.length;i++){
    p=players[i];
    if(p.stun>0){p.stun-=dt;p.vx*=0.8;p.vy*=0.8;}
    if(p.noTake>0) p.noTake-=dt;
    if(p.kickAnim>0) p.kickAnim-=dt;
    if(p.callT>0) p.callT-=dt;
    if(p.lunge>0) p.lunge-=dt;
    if(p.lungeCd>0) p.lungeCd-=dt;
    if(own===p) p.hold+=dt;
    if(p.stun<=0){
      if(p.isHero) heroUpdate(p,dt);
      else if(own===p) ownerAI(p,dt);
      else if(p.role==='gk') gkAI(p,dt);
      else fieldAI(p,dt,ch[p.team],own&&own.team===p.team,own&&own.team!==p.team);
    }
    own=ball.owner;
  }
  for(i=0;i<players.length;i++){
    for(var j=i+1;j<players.length;j++){
      var a=players[i],c=players[j],dx=c.x-a.x,dy=c.y-a.y,dd=hyp(dx,dy);
      if(dd<17&&dd>0.01){var push=(17-dd)/2;dx/=dd;dy/=dd;a.x-=dx*push;a.y-=dy*push;c.x+=dx*push;c.y+=dy*push;}
    }
  }
  for(i=0;i<players.length;i++){
    p=players[i];
    p.x=clamp(p.x+p.vx*dt,4,FW-4);p.y=clamp(p.y+p.vy*dt,8,FH-6);
    var spd=hyp(p.vx,p.vy);p.run+=spd*dt*0.1;
    var st=Math.floor(p.run/PI);
    if(st!==p.stepI){p.stepI=st;if(spd>125||p.lunge>0) dust(p.x-p.fx*6,p.y,1);}
    if(p.lunge>0&&Math.random()<0.6) dust(p.x-p.lx*8,p.y,1);
  }
  if(ball.owner){
    var o=ball.owner,tx=o.x+o.fx*15*o.size,ty=o.y+o.fy*12*o.size,kk=Math.min(1,dt*18);
    ball.x+=(tx-ball.x)*kk;ball.y+=(ty-ball.y)*kk;ball.z=0;
    ball.vx=o.vx;ball.vy=o.vy;ball.spin+=hyp(o.vx,o.vy)*dt*0.06;
    trySteal(dt);
  }else{
    ballPhysics(dt);
    if(G.state==='play') tryPickup();
    if(ball.fire&&Math.random()<0.8) parts.push({x:ball.x,y:ball.y-ball.z*0.8,vx:rnd(-30,30),vy:rnd(-30,30),g:0,life:0.35,max:0.35,c:'rgba(255,150,40,',s:rnd(5,9),k:0});
  }
  var bsp=hyp(ball.vx,ball.vy);
  if(!ball.owner&&bsp>330){trail.push({x:ball.x,y:ball.y-5-ball.z*0.8});if(trail.length>7) trail.shift();}
  else if(trail.length) trail.shift();
  if(G.state==='play'){
    updDog(dt);
    if(ball.owner===hero&&hero.x>FW*0.68&&Math.random()<dt*0.5){
      var mate=players[2];if(!mate.bub) say(mate,tr('shootIt'),0.9);
    }
  }
}

  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();}

    ctx.strokeStyle='rgba(253,251,243,.7)';ctx.lineWidth=2.5;
    if(ctx.setLineDash) ctx.setLineDash([7,7]);
    ctx.beginPath();ctx.moveTo(hero.x,hero.y-4);ctx.lineTo(am.x,am.y);ctx.stroke();
    if(ctx.setLineDash) ctx.setLineDash([]);
    ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.arc(am.x,am.y,9,0,TAU);ctx.stroke();
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(am.x,am.y,9,0,TAU);ctx.stroke();
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.55,G.flash*2).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
  if(G.state==='play'||G.state==='goal'){drawHUD();}
  if(G.state==='play') drawControls();
  drawOverlay();
}

/* ---------- ลูป ---------- */
var last=0,acc=0,STEP=1/60;
var errN=0;
function frame(ts){
  requestAnimationFrame(frame);
  try{
    var v=viewSize();
    if(v[0]!==W||v[1]!==H) resize();
    var dt=Math.min(0.1,(ts-last)/1000||0);last=ts;
    if(W<2||H<2||!bg||!bg.width||!bg.height) return;
    acc+=dt;
    var n=0;
    while(acc>=STEP&&n<4){if(!G.paused) update(STEP);acc-=STEP;n++;}
    if(n===4) acc=0;
    draw();
  }catch(e){
    if(errN++<3&&window.__showErr) window.__showErr(String(e&&e.message||e)+(e&&e.line?' (line '+e.line+')':''));
  }
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
document.addEventListener('visibilitychange',function(){last=performance.now();acc=0;});
mkBall();initCrowd();resize();setLang(LANG);setupMatch();G.state='title';G.freeze=0;
if(document.fonts&&document.fonts.load){try{document.fonts.load('600 20px Mitr','แข้ง').then(function(){if(W>1&&cv.width>1) buildBg();},function(){});}catch(e){}}
window.__game={G:G,update:update,draw:draw,start:menuTap,joy:joy,pressShoot:pressShoot,releaseShoot:releaseShoot,pressPass:pressPass,setMode:function(m){MODE=m;},
  get ball(){return ball;},get hero(){return hero;}};
requestAnimationFrame(frame);
})();
</script>
